# =============================================================================
#  ATENÇÃO — valores de DESENVOLVIMENTO. Secret NÃO é criptografia: "data" é só Base64.
#  Qualquer um com acesso ao repositório (ou a "kubectl get secret -o yaml") lê estes valores.
#  Produção (Aula 07): Azure Key Vault/HashiCorp Vault via External Secrets Operator ou driver CSI,
#  ou Sealed Secrets — e NUNCA commitar o valor real. "stringData" é usado aqui por legibilidade.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: payments-api-secrets
  namespace: fcg
  labels:
    app.kubernetes.io/name: payments-api
    app.kubernetes.io/part-of: fcg
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "1.0.0"
type: Opaque
stringData:
  ConnectionStrings__Database: "Host=payments-db;Port=5432;Database=fcg_payments;Username=fcg_payments;Password=payments_dev_pwd"
  RabbitMq__Username: "fcg"
  RabbitMq__Password: "fcg_dev_pwd"
---
apiVersion: v1
kind: Secret
metadata:
  name: payments-db-credentials
  namespace: fcg
  labels:
    app.kubernetes.io/name: payments-db
    app.kubernetes.io/part-of: fcg
    app.kubernetes.io/component: database
    app.kubernetes.io/version: "1.0.0"
type: Opaque
stringData:
  POSTGRES_DB: "fcg_payments"
  POSTGRES_USER: "fcg_payments"
  POSTGRES_PASSWORD: "payments_dev_pwd"
